<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('webサイト100個作る人のwebサイト', 'webサイトを100個作ることに挑戦中の個人が、これまでに作ったサイトをまとめて紹介しています。', false)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>

<main class="container">
    <section class="hero">
        <h1>webサイトを100個つくる挑戦</h1>
        <p class="lead">作ったサイトをここに順番に並べています。気になるものがあれば、のぞいてみてください。</p>

        <div class="progress">
            <p class="progress-label">
                いま <strong th:text="${catalog.count()}">2</strong> 個 ／ 目標 <span th:text="${catalog.goal()}">100</span> 個
            </p>
            <div class="progress-bar" role="progressbar" aria-label="進み具合" aria-valuemin="0"
                 th:attr="aria-valuemax=${catalog.goal()},aria-valuenow=${catalog.count()}">
                <span th:style="'width:' + ${catalog.progressPercent()} + '%'"></span>
            </div>
        </div>
    </section>

    <section aria-labelledby="sites-heading">
        <h2 id="sites-heading" class="section-title">作ったwebサイト</h2>
        <ul class="card-grid">
            <li class="card" th:each="site : ${catalog.newestFirst()}">
                <p class="card-number" th:text="${site.label()}">No.001</p>
                <h3 class="card-title" th:text="${site.title()}">サイト名</h3>
                <p class="card-text" th:text="${site.description()}">説明</p>
                <a class="button" th:href="${site.url()}"
                   th:attr="target=${site.external()} ? '_blank' : null, rel=${site.external()} ? 'noopener' : null">
                    サイトを見る<span th:if="${site.external()}" aria-label="（別のタブで開きます）"> ↗</span>
                </a>
            </li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
