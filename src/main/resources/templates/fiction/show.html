<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${fiction.title} + ' | フィクションブログ', ${fiction.excerpt}, false)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('fiction')}"></header>

<main class="container narrow">
    <p class="breadcrumb"><a th:href="@{/fiction}">← フィクションブログ一覧</a></p>

    <article class="post">
        <h1 class="post-title" th:text="${fiction.title}">タイトル</h1>
        <p class="meta">
            <span th:text="${fiction.authorName}">投稿者</span>
            <span aria-hidden="true">・</span>
            <time th:datetime="${fiction.createdAt}" th:text="${#temporals.format(fiction.createdAt, 'yyyy/MM/dd HH:mm')}">日時</time>
        </p>
        <p class="notice">※ この記事はフィクションです。実在の人物・団体とは関係ありません。</p>

        <div class="post-body" th:text="${fiction.readerBody}">本文</div>

        <p class="share">
            <a class="button button-outline" target="_blank" rel="noopener"
               th:href="@{https://x.com/intent/post(text=${fiction.title} + ' | フィクションブログ', url=${baseUrl + currentPath})}">Xでシェア</a>
        </p>
    </article>

    <p class="next-action"><a class="button" th:href="@{/fiction/new}">✏️ あなたも投稿する</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
