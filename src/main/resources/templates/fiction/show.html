<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${fiction.title} + ' | フィクションブログ', ${fiction.excerpt}, false)}"></head>
<body th:class="'site-' + ${site ?: 'hub'}">
<header th:replace="~{fragments/layout :: header('fiction')}"></header>

<main>
    <div class="wrap">
        <article class="article">
            <p class="breadcrumb"><a th:href="@{/fiction}">← フィクションブログ</a></p>
            <header class="article-head">
                <p class="story-kicker">
                    <span class="story-label">体験談</span>
                    <time th:datetime="${fiction.createdAt}" th:text="${#temporals.format(fiction.createdAt, 'yyyy年M月d日 HH:mm')}">日時</time>
                </p>
                <h1 th:text="${fiction.title}">タイトル</h1>
                <p class="story-byline">
                    <span class="avatar" th:classappend="'avatar-' + ${fiction.authorColor}" aria-hidden="true"
                          th:text="${fiction.authorInitial}">あ</span>
                    <span><span class="author" th:text="${fiction.authorName}">投稿者</span> さんの体験談</span>
                </p>
            </header>
            <p class="fiction-tape"><span>※ この記事はフィクションです。実在の人物・団体とは関係ありません。</span></p>

            <div class="article-body">
                <th:block th:each="b : ${blocks}">
                    <div class="prose" th:if="${b.text != null}" th:text="${b.text}">本文</div>
                    <figure class="article-figure" th:if="${b.image != null}">
                        <img th:src="@{/fiction/{id}/images/{no}.jpg(id=${fiction.id},no=${b.image.imageNo})}"
                             th:width="${b.image.width}" th:height="${b.image.height}"
                             th:alt="'投稿の画像（' + ${b.image.imageNo} + '枚目）'"
                             th:attr="loading=${b.image.imageNo == 1 ? 'eager' : 'lazy'}" decoding="async">
                    </figure>
                </th:block>
            </div>

            <footer class="article-foot">
                <a class="button button-outline button-small" target="_blank" rel="noopener"
                   th:href="@{https://x.com/intent/post(text=${fiction.title} + ' | フィクションブログ', url=${baseUrl + currentPath})}">X でシェア ↗</a>
                <a class="button button-small" th:href="@{/fiction/new}">あなたも投稿する</a>
            </footer>
        </article>

        <section class="story-more" th:unless="${more.empty}" aria-labelledby="more-h">
            <h2 class="story-head" id="more-h">ほかの体験談</h2>
            <ol class="story-grid">
                <th:block th:each="f : ${more}">
                    <li th:replace="~{fiction/parts :: card(${f}, ${images[f.id] != null ? images[f.id][0] : null})}"></li>
                </th:block>
            </ol>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
