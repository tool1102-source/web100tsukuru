<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('体験談を投稿する | フィクションブログ', 'フィクションブログに、架空の体験談を投稿するページです。', true)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('fiction')}"></header>

<main>
    <div class="wrap">
        <p class="breadcrumb"><a th:href="@{/fiction}">← フィクションブログ</a></p>
        <section class="page-head">
            <h1>体験談を投稿する</h1>
            <p class="lead">「やってみた」風の、架空の体験談を書いてください。投稿はすぐに公開されます。</p>
        </section>

        <div class="form-card">
            <p class="alert" role="alert" th:if="${rateLimited}">
                短い時間に投稿が続いたため、受け付けを止めています。10分ほどたってから、もう一度お試しください。
            </p>

            <form th:action="@{/fiction}" th:object="${fictionForm}" method="post" enctype="multipart/form-data" class="form" novalidate>
                <div class="form-group">
                    <label for="title">タイトル <span class="required">必須</span></label>
                    <input type="text" id="title" th:field="*{title}" placeholder="例：電車で一輪車をこいでみた話"
                           th:attr="maxlength=*{titleMax}" th:errorclass="is-invalid" required>
                    <p class="hint" th:text="*{titleMax} + '文字まで'">50文字まで</p>
                    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                </div>

                <div class="form-group">
                    <label for="authorName">投稿者名 <span class="required">必須</span></label>
                    <input type="text" id="authorName" th:field="*{authorName}" placeholder="ニックネームでOK"
                           th:attr="maxlength=*{authorMax}" th:errorclass="is-invalid" autocomplete="nickname" required>
                    <p class="error" th:if="${#fields.hasErrors('authorName')}" th:errors="*{authorName}"></p>
                </div>

                <div class="form-group">
                    <label for="body">本文 <span class="required">必須</span></label>
                    <p class="hint">
                        画像を入れたい場所に <code>[IMG]</code> と書いてください。下で選んだ画像が、選んだ順に入ります。
                    </p>
                    <button type="button" class="button button-outline button-small" id="insert-img" style="margin-top: 8px">[IMG] を入れる</button>
                    <textarea id="body" th:field="*{body}" rows="15" placeholder="本文を書いてください。"
                              th:attr="maxlength=*{bodyMax}" th:errorclass="is-invalid" required></textarea>
                    <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></p>
                </div>

                <div class="form-group">
                    <label for="images">画像 <span class="optional">任意</span></label>
                    <p class="hint">
                        5枚まで。本文の <code>[IMG]</code> の場所に、選んだ順に入ります（<code>[IMG]</code> が足りない分は最後に並びます）。大きい画像は自動で縮め、写真の位置情報などは消してから載せます。
                    </p>
                    <input type="file" id="images" name="images" accept="image/*" multiple>
                    <ol class="image-previews" id="image-previews" aria-label="選んだ画像"></ol>
                    <p class="error" th:if="${imageError}" th:text="${imageError}">画像は5枚までです。</p>
                    <p class="error" th:if="${imagesDropped == true and imageError == null and (rateLimited == true or #fields.hasErrors('*'))}">
                        画像はもう一度選んでください。
                    </p>
                </div>

                <!-- スパム対策のおとり欄（人には見えない） -->
                <div class="hp" aria-hidden="true">
                    <label for="website">ウェブサイト（入力しないでください）</label>
                    <input type="text" id="website" th:field="*{website}" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-actions">
                    <button type="submit" class="button">投稿する</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    document.getElementById('insert-img').addEventListener('click', function () {
        const textarea = document.getElementById('body');
        const placeholder = '[IMG]';
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + placeholder + textarea.value.substring(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + placeholder.length;
    });

    // 画像を選んだら、送る前にブラウザの中で長い辺 1600px までに縮めて JPEG にする
    // （スマホの大きな写真でもすぐ送れるように。サーバーでも同じように縮め直す）
    (function () {
        const input = document.getElementById('images');
        const previews = document.getElementById('image-previews');
        const submit = document.querySelector('.form-actions button[type="submit"]');
        const MAX_IMAGES = 5;
        const LONG_SIDE = 1600;
        if (!window.DataTransfer || !HTMLCanvasElement.prototype.toBlob) {
            return;
        }

        function shrink(file) {
            return new Promise(function (resolve) {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = function () {
                    const scale = Math.min(1, LONG_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(function (blob) {
                        const name = file.name.replace(/\.[^.]*$/, '') + '.jpg';
                        resolve(blob ? new File([blob], name, { type: 'image/jpeg' }) : file);
                    }, 'image/jpeg', 0.85);
                };
                // ブラウザで開けない画像は、そのまま送ってサーバーの判断に任せる
                img.onerror = function () {
                    URL.revokeObjectURL(url);
                    resolve(file);
                };
                img.src = url;
            });
        }

        input.addEventListener('change', async function () {
            const files = Array.from(input.files);
            previews.replaceChildren();
            if (files.length > MAX_IMAGES) {
                alert('画像は' + MAX_IMAGES + '枚までです。選び直してください。');
                input.value = '';
                return;
            }
            if (files.length === 0) {
                return;
            }
            const label = submit.textContent;
            submit.disabled = true;
            submit.textContent = '画像を準備しています…';
            const shrunk = [];
            for (const file of files) {
                shrunk.push(await shrink(file));
            }
            const transfer = new DataTransfer();
            shrunk.forEach(function (file) { transfer.items.add(file); });
            input.files = transfer.files;
            shrunk.forEach(function (file, i) {
                const item = document.createElement('li');
                const thumb = document.createElement('img');
                thumb.src = URL.createObjectURL(file);
                thumb.alt = '';
                const caption = document.createElement('span');
                caption.textContent = (i + 1) + '枚目';
                item.append(thumb, caption);
                previews.append(item);
            });
            submit.disabled = false;
            submit.textContent = label;
        });
    })();
</script>
</body>
</html>
