<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${page > 1 ? 'フィクションブログ（' + page + 'ページ目） | webサイト100個作る人のwebサイト' : 'フィクションブログ | webサイト100個作る人のwebサイト'}, '「やってみた」風の架空の体験談を、だれでも投稿して読めるブログです。', false)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('fiction')}"></header>

<main class="container">
    <section class="hero">
        <h1>フィクションブログ</h1>
        <p class="lead">「やってみた」風の、架空の体験談を集めたブログです。だれでも投稿できます。</p>
        <a class="button" th:href="@{/fiction/new}">✏️ 投稿する</a>
    </section>

    <p th:if="${fictions.empty}" class="empty">まだ投稿がありません。最初の1本を書いてみませんか？</p>

    <ul class="card-grid" th:unless="${fictions.empty}">
        <li class="card" th:each="f : ${fictions}">
            <h2 class="card-title"><a th:href="@{/fiction/{id}(id=${f.id})}" th:text="${f.title}">タイトル</a></h2>
            <p class="meta">
                <span th:text="${f.authorName}">投稿者</span>
                <span aria-hidden="true">・</span>
                <time th:datetime="${f.createdAt}" th:text="${#temporals.format(f.createdAt, 'yyyy/MM/dd HH:mm')}">日時</time>
            </p>
            <p class="card-text" th:text="${f.excerpt}">本文の冒頭</p>
        </li>
    </ul>

    <nav class="pager" aria-label="ページ送り" th:if="${fictions.totalPages > 1}">
        <a th:if="${fictions.hasPrevious()}" th:href="@{/fiction(page=${page - 1})}" rel="prev">← 新しい投稿</a>
        <span class="pager-status" th:text="${page} + ' / ' + ${fictions.totalPages}">1 / 3</span>
        <a th:if="${fictions.hasNext()}" th:href="@{/fiction(page=${page + 1})}" rel="next">古い投稿 →</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
