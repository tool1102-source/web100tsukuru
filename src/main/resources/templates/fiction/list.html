<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${page > 1 ? 'フィクションブログ（' + page + 'ページ目） | webサイト100個作る人のwebサイト' : 'フィクションブログ | webサイト100個作る人のwebサイト'}, '「やってみた」風の架空の体験談を、だれでも投稿して読めるブログです。', false)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('fiction')}"></header>

<main>
    <div class="wrap">
        <section class="page-head">
            <p class="eyebrow">No.002 · fiction blog</p>
            <h1>フィクションブログ</h1>
            <p class="lead">「やってみた」風の、ありそうでない体験談を集めたブログです。読むのも書くのも、だれでもどうぞ。</p>
            <div class="actions"><a class="button" th:href="@{/fiction/new}">体験談を投稿する</a></div>
        </section>

        <p th:if="${fictions.empty}" class="empty">まだ投稿がありません。最初の1本を書いてみませんか？</p>

        <ol class="posts" th:unless="${fictions.empty}">
            <li class="post-item" th:each="f : ${fictions}">
                <a th:href="@{/fiction/{id}(id=${f.id})}">
                    <h2 th:text="${f.title}">タイトル</h2>
                    <p class="meta">
                        <span class="author" th:text="${f.authorName}">投稿者</span><br>
                        <time th:datetime="${f.createdAt}" th:text="${#temporals.format(f.createdAt, 'yyyy.MM.dd HH:mm')}">日時</time>
                    </p>
                    <p class="excerpt" th:text="${f.excerpt}">本文の冒頭</p>
                </a>
            </li>
        </ol>

        <nav class="pager" aria-label="ページ送り" th:if="${fictions.totalPages > 1}">
            <a class="button button-outline button-small" th:if="${fictions.hasPrevious()}" th:href="@{/fiction(page=${page - 1})}" rel="prev">← 新しい投稿</a>
            <span class="pager-status" th:text="${page} + ' / ' + ${fictions.totalPages}">1 / 3</span>
            <a class="button button-outline button-small" th:if="${fictions.hasNext()}" th:href="@{/fiction(page=${page + 1})}" rel="next">古い投稿 →</a>
        </nav>
        <div class="pager" th:unless="${fictions.totalPages > 1}"></div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
