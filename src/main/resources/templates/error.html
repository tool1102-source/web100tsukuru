<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('エラーが発生しました | webサイト100個作る人のwebサイト', 'エラーが発生しました。', true)}"></head>
<body th:class="'site-' + ${site ?: 'hub'}">
<header th:replace="~{fragments/layout :: header('')}"></header>

<main>
    <div class="wrap">
        <section class="error-page">
            <p class="error-code" th:text="${status}">500</p>
            <h1>エラーが発生しました</h1>
            <p>しばらくたってから、もう一度お試しください。</p>
            <div class="actions" style="margin-top: 12px">
                <a class="button" th:href="@{/}">トップページへ</a>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
