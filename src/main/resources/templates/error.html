<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('エラーが発生しました | webサイト100個作る人のwebサイト', 'エラーが発生しました。', true)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container narrow">
    <section class="post error-page">
        <p class="error-code" th:text="${status}">500</p>
        <h1 class="post-title">エラーが発生しました</h1>
        <p>しばらくたってから、もう一度お試しください。</p>
        <p><a class="button" th:href="@{/}">トップページへ</a></p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
