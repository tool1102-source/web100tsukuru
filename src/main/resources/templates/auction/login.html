<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ログイン | らくがきオークション', 'らくがきオークションにログインするページです。', true)}"></head>
<body th:class="'site-' + ${site ?: 'hub'}">
<header th:replace="~{fragments/layout :: header('auction')}"></header>

<main>
    <div class="wrap">
        <p class="breadcrumb"><a th:href="@{/auction}">← 競り場</a></p>
        <section class="page-head">
            <h1>ログイン</h1>
            <p class="lead">アカウントは「ちいさな投票所」と共通です。1日1回、コインを<b th:text="${@coinService.dailyBonus}">100</b>枚受け取れます。</p>
        </section>

        <div class="form-card">
            <div th:replace="~{auction/parts :: messages}"></div>
            <div th:replace="~{auction/parts :: google(${next})}"></div>
            <p class="or-divider" th:if="${@googleIdTokens.enabled}"><span>または ID とパスワードで</span></p>
            <form th:action="@{/auction/login}" method="post" class="form" novalidate>
                <input type="hidden" name="next" th:value="${next}">
                <div class="form-group">
                    <label for="loginId">ログイン ID</label>
                    <input type="text" id="loginId" name="loginId" th:value="${loginId}" autocomplete="username"
                           maxlength="20" required autocapitalize="none" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" maxlength="72" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="button button-gold">ログイン</button>
                </div>
            </form>
            <p class="form-foot">はじめての方は <a th:href="@{/auction/signup(next=${next})}">新規登録</a>（コインを<span th:text="${#numbers.formatInteger(@coinService.startCoins, 1, 'COMMA')}">1,000</span>枚受け取れます）</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
