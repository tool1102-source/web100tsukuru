<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${collector.name()} + ' | らくがきオークション', ${collector.name()} + '：' + ${collector.taste()}, false)}"></head>
<body th:class="'site-' + ${site ?: 'hub'}">
<header th:replace="~{fragments/layout :: header('auction')}"></header>

<main>
    <div class="wrap">
        <p class="breadcrumb"><a th:href="@{/auction/collectors}">← 収集家</a></p>
        <section class="collector-head">
            <span class="who-icon who-icon-huge" aria-hidden="true" th:style="'background-color:' + ${collector.color()}" th:text="${collector.initial()}">赤</span>
            <div>
                <h1 th:text="${collector.name()}">赤坂伯爵</h1>
                <p class="lead" th:text="${collector.taste()}">好み</p>
                <p class="collector-stars">財力 <span th:text="${#strings.repeat('★', collector.stars())} + ${#strings.repeat('☆', 5 - collector.stars())}">★★★☆☆</span></p>
                <p class="collector-days">
                    <span class="fan-day" th:classappend="${today.attends(collector.key())} ? 'is-on'" th:text="${today.attends(collector.key())} ? '今日来場' : '今日は来ない'">今日来場</span>
                    <span class="fan-day" th:classappend="${tomorrow.attends(collector.key())} ? 'is-on'" th:text="${tomorrow.attends(collector.key())} ? '明日来場' : '明日は来ない'">明日来場</span>
                </p>
                <p class="collector-quote" th:text="'「' + ${collector.openLines().get(0)} + '」'">「ひとこと」</p>
            </div>
        </section>

        <section class="auction-section">
            <div class="auction-section-head">
                <h2>持っている絵</h2>
                <p>競り落とした絵は1〜3日飾ってから、また1時間の競りに出します。3回続けて売れないと、手放さなくなります。</p>
            </div>
            <ul class="lot-grid lot-grid-small" th:unless="${owned.isEmpty()}">
                <th:block th:each="c : ${owned}"><li th:replace="~{auction/parts :: workCard(${c})}"></li></th:block>
            </ul>
            <p class="auction-empty-line" th:if="${owned.isEmpty()}">まだ持っている絵はありません。</p>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
