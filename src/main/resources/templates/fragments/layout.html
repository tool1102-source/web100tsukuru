<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!--
  全ページ共通の部品。
  使い方: <head th:replace="~{fragments/layout :: head('タイトル', '説明文', false)}"></head>
  3つ目を true にすると検索結果に出さない（投稿フォームやエラー画面用）。
-->
<head th:fragment="head(title, description, noindex)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">webサイト100個作る人のwebサイト</title>
    <meta name="description" th:content="${description}">
    <meta name="robots" content="noindex" th:if="${noindex}">
    <link rel="canonical" th:if="${baseUrl != null and !noindex}" th:href="${baseUrl + currentPath}">

    <meta property="og:type" th:content="${currentPath == '/' ? 'website' : 'article'}">
    <meta property="og:site_name" content="webサイト100個作る人のwebサイト">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:if="${baseUrl != null}" th:content="${baseUrl + currentPath}">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@web100tsukuru">

    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" th:href="@{/favicon.ico}">

    <!-- 数字と英字の見出しだけに使う書体（日本語は端末の書体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <meta name="google-site-verification" content="yj4LGgoltxROKbI2DaOK9eTDbavhFgUfPISmX5yaD44">
    <!-- 広告は読み物のページだけ。フォーム・エラー・管理画面には載せない（AdSense の規約） -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4550031417169253"
            crossorigin="anonymous" th:unless="${noindex}"></script>
</head>
<body>

<header class="site-header" th:fragment="header(active)">
    <div class="wrap site-header-inner">
        <a class="logo" th:href="@{/}" aria-label="webサイト100個作る人のwebサイト トップへ">
            <span class="logo-mark" aria-hidden="true">100</span>
            <span class="logo-text">webサイト100個作る人</span>
        </a>
        <nav class="site-nav" aria-label="メニュー">
            <a th:href="@{/}" th:attr="aria-current=${active == 'home'} ? 'page' : null">作ったサイト</a>
            <a th:href="@{/fiction}" th:attr="aria-current=${active == 'fiction'} ? 'page' : null"><span class="nav-long">フィクション</span>ブログ</a>
            <a th:href="@{/vote}" th:attr="aria-current=${active == 'vote'} ? 'page' : null"><span class="nav-long">ちいさな</span>投票所</a>
            <a class="nav-ext" href="https://note.com/web100tsukuru" target="_blank" rel="noopener">note</a>
            <a class="nav-ext" href="https://x.com/web100tsukuru" target="_blank" rel="noopener">X</a>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="wrap site-footer-inner">
        <div>
            <p class="footer-title">webサイト100個作る人のwebサイト</p>
            <p class="footer-text">webサイトを100個つくる挑戦の記録です。作る過程は note と X で発信しています。</p>
        </div>
        <ul class="footer-links">
            <li><a th:href="@{/}">作ったサイト</a></li>
            <li><a th:href="@{/fiction}">フィクションブログ</a></li>
            <li><a th:href="@{/vote}">ちいさな投票所</a></li>
            <li><a href="https://note.com/web100tsukuru" target="_blank" rel="noopener">note</a></li>
            <li><a href="https://x.com/web100tsukuru" target="_blank" rel="noopener">X（@web100tsukuru）</a></li>
        </ul>
        <p class="copyright" th:with="y=${#temporals.year(#temporals.createNow())}">
            &copy; <span th:text="${y > 2025 ? '2025–' + y : '2025'}">2025</span> webサイト100個作る人
        </p>
    </div>
</footer>

</body>
</html>
