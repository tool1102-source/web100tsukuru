<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${poll.title} + ' | ちいさな投票所', ${poll.open} ? '「' + ${#strings.listJoin(view.options().![label()], '」「')} + '」どれにするか、投票券で決めてください。1位のとおりに、本当にやります。' : '投票の結果と、そのとおりにやった報告。', false)}"></head>
<body th:class="'site-' + ${site ?: 'hub'}">
<header th:replace="~{fragments/layout :: header('vote')}"></header>

<main>
    <div class="wrap">
        <article class="article poll">
            <p class="breadcrumb"><a th:href="@{/vote}">← ちいさな投票所</a></p>
            <div th:replace="~{vote/parts :: messages}"></div>

            <header class="article-head">
                <p class="poll-state" th:classappend="${poll.open} ? 'is-open' : 'is-closed'"
                   th:text="${poll.open} ? '受付中 ・ ' + ${poll.timeLeft} : '締め切りました'">受付中</p>
                <h1 th:text="${poll.title}">お題</h1>
                <p class="meta">
                    <span class="author" th:text="${view.ownerName()}">出した人</span> さんのお題
                    <span aria-hidden="true"> ・ </span>
                    締め切り <time th:datetime="${poll.closesAt}" th:text="${#temporals.format(poll.closesAt, 'M月d日 HH:mm')}">日時</time>
                </p>
            </header>

            <figure class="article-figure poll-figure" th:if="${view.questionImage() != null}">
                <img th:src="@{/vote/{id}/images/0.jpg(id=${poll.id})}" alt="お題の画像"
                     th:width="${view.questionImage().width}" th:height="${view.questionImage().height}" decoding="async">
            </figure>
            <p class="prose poll-detail" th:if="${poll.detail != null}" th:text="${poll.detail}">説明</p>

            <section class="poll-result" th:unless="${poll.open}" aria-label="結果">
                <th:block th:if="${view.winners().isEmpty()}">
                    <p class="poll-result-head">投票はありませんでした</p>
                </th:block>
                <th:block th:unless="${view.winners().isEmpty()}">
                    <p class="poll-result-label" th:text="${view.winners().size() > 1} ? '同じ枚数で1位が並びました' : '1位'">1位</p>
                    <p class="poll-result-head" th:text="${#strings.listJoin(view.winners().![label()], '・')}">A</p>
                    <p class="poll-result-note" th:unless="${poll.reported}"
                       th:text="${view.ownerName()} + ' さんは、このとおりにやって報告します。'">報告します</p>
                </th:block>
            </section>

            <section class="poll-options" id="options" aria-label="選択肢">
                <div class="poll-option" th:each="o : ${view.options()}" th:classappend="${o.winner()} ? 'is-winner'">
                    <div class="poll-option-head">
                        <span class="poll-option-label" th:text="${o.label()}">選択肢</span>
                        <span class="poll-option-count">
                            <b th:text="${#numbers.formatInteger(o.tickets(), 1, 'COMMA')}">0</b>枚
                            <span class="muted" th:text="'（' + ${o.percent()} + '%）'">（0%）</span>
                        </span>
                    </div>
                    <div class="poll-bar" aria-hidden="true"><span th:style="'width:' + ${o.percent()} + '%'"></span></div>
                    <p class="poll-option-mine" th:if="${o.myTickets() > 0}">
                        あなたは <b th:text="${#numbers.formatInteger(o.myTickets(), 1, 'COMMA')}">0</b>枚
                        <th:block th:unless="${poll.open}">
                            <span th:if="${o.winner()}">（1位になったので使われました）</span>
                            <span th:unless="${o.winner()}">（1位にならなかったので戻りました）</span>
                        </th:block>
                    </p>
                    <form class="poll-vote-form" th:if="${poll.open and me != null and me.totalTickets > 0}" th:action="@{/vote/{id}/tickets(id=${poll.id})}" method="post">
                        <input type="hidden" name="optionId" th:value="${o.id()}">
                        <label class="visually-hidden" th:for="'tickets-' + ${o.id()}" th:text="${o.label()} + ' に入れる枚数'">枚数</label>
                        <input type="number" class="ticket-input" th:id="'tickets-' + ${o.id()}" name="tickets" value="1" min="1"
                               th:attr="max=${me.totalTickets}" inputmode="numeric" required>
                        <button type="button" class="button button-outline button-small" th:attr="data-all=${me.totalTickets}">全部</button>
                        <button type="submit" class="button button-small">入れる</button>
                    </form>
                </div>
                <p class="status" th:if="${poll.open and me != null and me.totalTickets == 0}"
                   th:text="'投票券がなくなりました。明日のログインボーナスで' + ${@accountService.dailyBonus} + '枚増えます。締め切りで1位にならなかった券も戻ってきます。'">券がなくなりました</p>
                <p class="poll-total" th:text="'合計 ' + ${#numbers.formatInteger(view.totalTickets(), 1, 'COMMA')} + '枚'">合計 0枚</p>
                <p class="poll-login" th:if="${poll.open and me == null}">
                    <a class="button" th:href="@{/vote/signup(next=${currentPath})}"
                       th:text="'登録して投票券を' + ${@accountService.signupTickets} + '枚もらう'">登録して投票券をもらう</a>
                    <a class="button button-outline" th:href="@{/vote/login(next=${currentPath})}">ログインして投票する</a>
                </p>
                <p class="hint poll-hint" th:if="${poll.open}">
                    券は何枚でも、何回でも入れられます。締め切りで1位にならなかった選択肢に入れた券は、全部戻ってきます。
                </p>
            </section>

            <section class="poll-report" th:unless="${poll.open}" aria-labelledby="report-h">
                <h2 id="report-h" th:text="${poll.reported} ? 'やりました！' : '報告を待っています'">報告</h2>
                <th:block th:if="${poll.reported}">
                    <p class="prose" th:text="${poll.reportText}">報告</p>
                    <figure class="article-figure" th:each="img : ${view.reportImages()}">
                        <img th:src="@{/vote/{id}/images/{slot}.jpg(id=${poll.id},slot=${img.slot})}"
                             th:width="${img.width}" th:height="${img.height}"
                             th:alt="'報告の写真（' + ${img.slot} + '枚目）'" loading="lazy" decoding="async">
                    </figure>
                </th:block>
                <p class="hint" th:if="${!poll.reported and !view.owner()}">出した人が1位のとおりにやったら、ここに報告が届きます。</p>
                <p th:if="${!poll.reported and view.owner()}">
                    <a class="button" th:href="@{/vote/{id}/report(id=${poll.id})}">1位のとおりにやったら、報告する</a>
                </p>
            </section>

            <footer class="article-foot">
                <a class="button button-outline button-small" target="_blank" rel="noopener"
                   th:href="@{https://x.com/intent/post(text=${poll.reported} ? '投票どおりにやりました：' + ${poll.title} : '「' + ${poll.title} + '」投票券で決めてください #ちいさな投票所', url=${baseUrl + currentPath})}">X でシェア ↗</a>
                <a class="button button-small" th:href="@{/vote/new}">あなたもお題を出す</a>
            </footer>
        </article>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    // 「全部」を押したら、持っている券を全部入れる枚数にする
    document.querySelectorAll('.poll-vote-form [data-all]').forEach(function (button) {
        button.addEventListener('click', function () {
            button.form.querySelector('.ticket-input').value = button.dataset.all;
        });
    });
</script>
</body>
</html>
