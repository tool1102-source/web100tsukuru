spring.application.name=web100tsukuru

# ----------------------------------------------------
# 接続情報はすべて環境変数から読み込む（値をリポジトリに書かない）
#
# 【DB】Render の Environment に次のどちらかを登録:
#   (かんたん) DATABASE_URL = Render の DB 画面の「Internal Database URL」をそのまま貼る
#   (個別指定) DB_URL / DB_USERNAME / DB_PASSWORD
#   DATABASE_URL があればそちらが優先される（config/DatabaseUrlEnvironmentPostProcessor）
#
# 【Cloudinary】画像アップロード機能を作るときに登録（今は未使用）:
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# ----------------------------------------------------

# Cloudinary接続情報
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# PostgreSQL 例: jdbc:postgresql://<host>:5432/<db名>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DB への接続は、使わなくなったら1分で閉じる。
# 接続を開きっぱなしにすると Neon の DB が休止できず、無料枠の稼働時間を使い切ってしまう。
# （トップページは DB を使わないので、UptimeRobot の死活監視だけなら DB は眠ったままになる）
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
# 休止中の DB が起きるまで少し待てるように
spring.datasource.hikari.connection-timeout=20000

# ----------------------------------------------------
# その他のJPA設定
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# 画面の描画中にDBへ問い合わせない（警告の解消と接続の早期返却）
spring.jpa.open-in-view=false

# ----------------------------------------------------
# サイト設定
# ----------------------------------------------------
# canonical URL・OGP・サイトマップに使う本番URL
app.base-url=${BASE_URL:https://web100tsukuru.com}
# 連続投稿の制限（同じ接続元から 10分に3件まで）
app.post-limit.max=3
app.post-limit.window=10m
# 投稿に付ける画像。ふつうはブラウザで縮めてから届くが、縮められなかったときのために大きめに受ける
# （届いた画像はサーバーでも長い辺 1600px の JPEG にし直して DB に保存する：service/ImageProcessor）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# 管理画面（/admin）の合言葉を SHA-256 にした値（合言葉そのものは置かない。管理する人のブラウザに保存してある）
# 合言葉を変えるときは、新しい値を Render の環境変数 ADMIN_PASSWORD_HASH に入れる。空にすると管理画面ごと無効（404）
app.admin-password-hash=${ADMIN_PASSWORD_HASH:76ce371cfcbbe60357e1126f5f17446433dd13ca8cc76e87ba381e6067548ae6}
# ログイン状態を持つ Cookie は、よそのサイトからのリクエストには付けない（勝手に削除させない）
server.servlet.session.cookie.same-site=strict
# Render の上（https）でだけ Secure を付ける。手元の http でもログインを試せるように
server.servlet.session.cookie.secure=${RENDER:false}
# セッションIDを URL に載せない
server.servlet.session.tracking-modes=cookie

# Render の中継サーバー越しでも、訪問者の本当のIPを使う（連続投稿の制限用）
server.forward-headers-strategy=native
# 文字を圧縮して送る（表示を速くする）
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,application/xml,text/plain,image/svg+xml
# CSS などはブラウザに1日キャッシュさせる。
# CSS の URL に中身のハッシュを付けるので、書き換えたらすぐ新しいものが読まれる
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**

# アクセスの記録を Render のログに出す（どこから何が来て、何を返したか）
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=access %a "%r" %s %b %{ms}Tms host=%{Host}i "%{User-Agent}i"
