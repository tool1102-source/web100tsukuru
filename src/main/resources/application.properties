spring.application.name=web100tsukuru

# ----------------------------------------------------
# 接続情報はすべて環境変数から読み込む（値をリポジトリに書かない）
#
# 【DB】Render の Environment に次のどちらかを登録:
#   (かんたん) DATABASE_URL = Render の DB 画面の「Internal Database URL」をそのまま貼る
#   (個別指定) DB_URL / DB_USERNAME / DB_PASSWORD
#   DATABASE_URL があればそちらが優先される（config/DatabaseUrlEnvironmentPostProcessor）
#
# 【Cloudinary】画像アップロード機能を作るときに登録（今は未使用）:
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# ----------------------------------------------------

# Cloudinary接続情報
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# PostgreSQL 例: jdbc:postgresql://<host>:5432/<db名>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------------------
# その他のJPA設定
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
