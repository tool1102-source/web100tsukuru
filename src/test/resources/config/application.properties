# テスト時はメモリ上のH2を使う（本番DBや秘密情報は不要）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
# テストでは連続投稿の制限をゆるめる（制限そのものは専用のテストで確認）
app.post-limit.max=1000
# 管理画面は、合言葉を使うテストでだけ有効にする
app.admin-password-hash=
# テストでは、投票所の回数の制限もゆるめる
app.vote.signup-limit=1000
app.vote.login-limit=1000
app.vote.create-limit=1000
app.vote.vote-limit=100000
